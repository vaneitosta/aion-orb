name: AION quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test AION Orb interactions
        run: |
          node tests/smoke.cjs
          node tests/pwa.cjs
          node tests/gateway.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Run mobile viewport browser checks
        run: |
          node tests/browser.cjs
          node tests/offline.cjs
      - name: Run Safari-engine mobile checks
        env:
          AION_BROWSER: webkit
        run: node tests/browser.cjs
      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-mobile-screenshot
          path: aion-mobile-test.png
          if-no-files-found: ignore
